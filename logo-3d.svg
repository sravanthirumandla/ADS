<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- Premium metallic blue gradients -->
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="20%" stop-color="#3B82F6"/>
      <stop offset="50%" stop-color="#2563EB"/>
      <stop offset="80%" stop-color="#1D4ED8"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>
    <linearGradient id="darkGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="extrudeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E40AF"/>
      <stop offset="50%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="arrowBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="40%" stop-color="#0891B2"/>
      <stop offset="100%" stop-color="#0E7490"/>
    </linearGradient>
    <linearGradient id="arrowGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>
    <linearGradient id="apexGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93C5FD"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="shineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="white" stop-opacity="0.5"/>
      <stop offset="40%" stop-color="white" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <filter id="dropShadow">
      <feDropShadow dx="0" dy="10" stdDeviation="20" flood-color="#0F172A" flood-opacity="0.3"/>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="innerGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="200" height="200" fill="url(#bgGrad)" rx="24"/>
  
  <!-- Subtle background ring -->
  <circle cx="92" cy="100" r="82" fill="none" stroke="#2563EB" stroke-width="0.8" opacity="0.06"/>

  <!-- === EXTRUSION BODY (Side faces connecting back to front) === -->

  <!-- Deepest extrusion (bottom-right shadow) -->
  <g transform="translate(18, 18)" opacity="0.35">
    <path d="M92 25 L18 180" stroke="#0F172A" stroke-width="34" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M92 25 L166 180" stroke="#0F172A" stroke-width="34" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- Extrusion layer 4 -->
  <g transform="translate(15, 15)">
    <path d="M92 25 L18 180" stroke="#0F172A" stroke-width="34" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M92 25 L166 180" stroke="#0F172A" stroke-width="34" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- Extrusion layer 3 -->
  <g transform="translate(12, 12)">
    <path d="M92 25 L18 180" stroke="#1E3A8A" stroke-width="34" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M92 25 L166 180" stroke="#1E3A8A" stroke-width="34" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- Extrusion layer 2 -->
  <g transform="translate(9, 9)">
    <path d="M92 25 L18 180" stroke="url(#extrudeGrad)" stroke-width="34" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M92 25 L166 180" stroke="url(#extrudeGrad)" stroke-width="34" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- Extrusion layer 1 (nearest to front) -->
  <g transform="translate(5, 5)">
    <path d="M92 25 L18 180" stroke="url(#darkGrad)" stroke-width="34" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M92 25 L166 180" stroke="url(#darkGrad)" stroke-width="34" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- === FRONT FACE: The "A" Letterform === -->
  <g filter="url(#dropShadow)">
    <!-- Left leg -->
    <path d="M92 25 L18 180" stroke="url(#bodyGrad)" stroke-width="34" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- Right leg -->
    <path d="M92 25 L166 180" stroke="url(#bodyGrad)" stroke-width="34" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- === INTEGRATED ARROW CROSSBAR === -->
  <!-- The crossbar is a V-shape pointing upward, representing an integrated arrow -->
  <g filter="url(#dropShadow)">
    <path d="M44 128 L92 100 L140 128" stroke="url(#bodyGrad)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- === CYAN ARROW SHAFT RISING FROM THE CROSSBAR === -->
  <!-- Arrow shaft rising from the V midpoint (the arrow tip) -->
  <g filter="url(#softGlow)">
    <path d="M92 100 L92 78" stroke="url(#arrowBody)" stroke-width="6" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Arrowhead -->
  <path d="M92 78 L85 88 M92 78 L99 88" stroke="url(#arrowGlow)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#softGlow)"/>

  <!-- Arrow tip glow dot -->
  <circle cx="92" cy="76" r="3.5" fill="#22D3EE" filter="url(#softGlow)"/>
  <circle cx="92" cy="76" r="1.5" fill="white" opacity="0.9"/>

  <!-- === SURFACE REFLECTIONS (Metallic Shine) === -->

  <!-- Left leg light reflection (top-left light source) -->
  <path d="M85 32 L30 158" stroke="url(#shineGrad)" stroke-width="10" stroke-linecap="round" fill="none"/>

  <!-- Right leg subtle reflection -->
  <path d="M100 35 L158 160" stroke="url(#shineGrad)" stroke-width="8" stroke-linecap="round" fill="none"/>

  <!-- Apex shine -->
  <ellipse cx="90" cy="30" rx="12" ry="6" fill="url(#apexGlow)" opacity="0.4" transform="rotate(-20 90 30)"/>

  <!-- Crossbar reflection (left side) -->
  <path d="M50 125 L82 106" stroke="white" stroke-width="3" opacity="0.15" stroke-linecap="round" fill="none"/>

  <!-- === METALLIC EDGE LINES === -->
  <!-- Sharp edge highlights on outer left of left leg -->
  <path d="M82 32 L28 168" stroke="white" stroke-width="1.5" opacity="0.12" stroke-linecap="round" fill="none"/>
  <!-- Sharp edge on outer right of right leg -->
  <path d="M102 32 L156 168" stroke="white" stroke-width="1" opacity="0.08" stroke-linecap="round" fill="none"/>

  <!-- === SIDE EXTRUSION HIGHLIGHT === -->
  <!-- Small specular highlight on the extrusion edge -->
  <path d="M92 25 L92 45" stroke="white" stroke-width="2" opacity="0.2" stroke-linecap="round" fill="none"/>

  <!-- === SHADOW ON GROUND === -->
  <ellipse cx="92" cy="192" rx="72" ry="5" fill="#0F172A" opacity="0.08"/>
</svg>