<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- Premium metallic blue gradients -->
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="20%" stop-color="#3B82F6"/>
      <stop offset="50%" stop-color="#2563EB"/>
      <stop offset="80%" stop-color="#1D4ED8"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>
    <linearGradient id="extrudeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E40AF"/>
      <stop offset="50%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="arrowBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="40%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#0891B2"/>
    </linearGradient>
    <linearGradient id="arrowGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67E8F9"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#06B6D4" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="apexGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93C5FD"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="white" stop-opacity="0.35"/>
      <stop offset="30%" stop-color="white" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <filter id="dropShadow">
      <feDropShadow dx="0" dy="12" stdDeviation="24" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="outerGlow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Dark navy premium background -->
  <rect width="200" height="200" fill="url(#bgGrad)" rx="24"/>
  
  <!-- Orbital ring -->
  <circle cx="92" cy="100" r="76" fill="none" stroke="url(#ringGrad)" stroke-width="1"/>
  <circle cx="92" cy="100" r="72" fill="none" stroke="url(#ringGrad)" stroke-width="0.5"/>

  <!-- Ambient glow behind logo -->
  <circle cx="92" cy="100" r="50" fill="#2563EB" opacity="0.06" filter="url(#outerGlow)"/>

  <!-- === 3D EXTRUSION LAYERS === -->

  <!-- Deepest shadow -->
  <g transform="translate(20, 20)" opacity="0.4">
    <path d="M92 22 L16 180" stroke="#000000" stroke-width="34" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M92 22 L168 180" stroke="#000000" stroke-width="34" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- Extrusion layer 4 -->
  <g transform="translate(16, 16)">
    <path d="M92 22 L16 180" stroke="#020617" stroke-width="34" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M92 22 L168 180" stroke="#020617" stroke-width="34" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- Extrusion layer 3 -->
  <g transform="translate(12, 12)">
    <path d="M92 22 L16 180" stroke="#0F172A" stroke-width="34" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M92 22 L168 180" stroke="#0F172A" stroke-width="34" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- Extrusion layer 2 -->
  <g transform="translate(8, 8)">
    <path d="M92 22 L16 180" stroke="#1E3A8A" stroke-width="34" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M92 22 L168 180" stroke="#1E3A8A" stroke-width="34" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- Extrusion layer 1 -->
  <g transform="translate(4, 4)">
    <path d="M92 22 L16 180" stroke="url(#extrudeGrad)" stroke-width="34" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M92 22 L168 180" stroke="url(#extrudeGrad)" stroke-width="34" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- === FRONT FACE: The "A" Letterform === -->
  <g filter="url(#dropShadow)">
    <path d="M92 22 L16 180" stroke="url(#bodyGrad)" stroke-width="34" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M92 22 L168 180" stroke="url(#bodyGrad)" stroke-width="34" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- === INTEGRATED ARROW CROSSBAR === -->
  <g filter="url(#dropShadow)">
    <path d="M44 130 L92 100 L140 130" stroke="url(#bodyGrad)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- === CYAN ARROW RISING FROM INSIDE THE A === -->
  <!-- The arrow shaft -->
  <g filter="url(#softGlow)">
    <path d="M92 100 L92 74" stroke="url(#arrowBody)" stroke-width="6" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Arrowhead -->
  <path d="M92 74 L84 86 M92 74 L100 86" stroke="url(#arrowGlow)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#softGlow)"/>

  <!-- Arrow tip glow -->
  <circle cx="92" cy="72" r="4" fill="#67E8F9" filter="url(#softGlow)"/>
  <circle cx="92" cy="72" r="2" fill="white" opacity="0.95"/>

  <!-- === METALLIC REFLECTIONS === -->

  <!-- Left leg surface shine -->
  <path d="M84 30 L28 160" stroke="url(#shine)" stroke-width="10" stroke-linecap="round" fill="none"/>

  <!-- Right leg subtle shine -->
  <path d="M100 32 L160 162" stroke="url(#shine)" stroke-width="7" stroke-linecap="round" fill="none"/>

  <!-- Apex highlight -->
  <ellipse cx="90" cy="28" rx="14" ry="5" fill="url(#apexGlow)" opacity="0.3" transform="rotate(-18 90 28)"/>
  <path d="M86 24 L96 24" stroke="white" stroke-width="2" opacity="0.2" stroke-linecap="round" fill="none"/>

  <!-- Edge specular highlights (sharp metallic edges) -->
  <path d="M80 30 L22 168" stroke="white" stroke-width="1.5" opacity="0.1" stroke-linecap="round" fill="none"/>
  <path d="M104 30 L160 168" stroke="white" stroke-width="1" opacity="0.06" stroke-linecap="round" fill="none"/>

  <!-- Crossbar reflection -->
  <path d="M50 127 L84 106" stroke="white" stroke-width="2.5" opacity="0.12" stroke-linecap="round" fill="none"/>

  <!-- Arrow shaft glow reflection -->
  <path d="M90 76 L90 96" stroke="white" stroke-width="1.5" opacity="0.15" stroke-linecap="round" fill="none"/>
</svg>