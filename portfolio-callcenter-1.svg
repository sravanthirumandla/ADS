  </defs>
  <rect width="400" height="250" fill="url(#c1bg)" rx="12"/>
  <!-- Desk -->
  <rect x="20" y="190" width="360" height="8" rx="2" fill="white" stroke="#e5e7eb" stroke-width="1"/>
