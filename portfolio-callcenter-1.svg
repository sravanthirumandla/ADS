    <rect x="0" y="0" width="70" height="50" rx="4" fill="#1f2937"/>
    <rect x="3" y="3" width="64" height="44" rx="2" fill="#312e81"/>
    <rect x="8" y="8" width="20" height="14" rx="2" fill="rgba(99,102,241,0.4)"/>
    <rect x="32" y="8" width="12" height="14" rx="2" fill="rgba(16,185,129,0.4)"/>
    <rect x="48" y="8" width="14" height="14" rx="2" fill="rgba(251,191,36,0.4)"/>
