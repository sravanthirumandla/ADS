    <path d="M2 2 Q2 -6 12 -6 Q22 -6 22 2 L22 6 Q22 10 18 10 L16 10 Q14 10 14 8 L14 4 Q14 2 12 2 Q10 2 10 4 L10 8 Q10 10 8 10 L6 10 Q2 10 2 6Z" fill="url(#c1g)" opacity="0.6"/>
