<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="400" height="250">
  <defs>
    <linearGradient id="p2bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf2f8"/>
      <stop offset="100%" stop-color="#fce7f3"/>
    </linearGradient>
    <linearGradient id="p2g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#db2777"/>
    </linearGradient>
    <linearGradient id="p2sk" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fecaca"/>
      <stop offset="100%" stop-color="#fca5a5"/>
    </linearGradient>
  </defs>
  <rect width="400" height="250" fill="url(#p2bg)" rx="12"/>
  <!-- Timeline / Gantt chart -->
  <rect x="25" y="30" width="350" height="175" rx="6" fill="white" stroke="#e5e7eb" stroke-width="1"/>
  <!-- Grid lines -->
  <g stroke="#f3f4f6" stroke-width="0.5">
    <line x1="120" y1="45" x2="120" y2="195"/>
    <line x1="200" y1="45" x2="200" y2="195"/>
    <line x1="280" y1="45" x2="280" y2="195"/>
    <line x1="360" y1="45" x2="360" y2="195"/>
    <line x1="40" y1="70" x2="365" y2="70"/>
    <line x1="40" y1="100" x2="365" y2="100"/>
    <line x1="40" y1="130" x2="365" y2="130"/>
    <line x1="40" y1="160" x2="365" y2="160"/>
  </g>
  <!-- Timeline bars -->
  <g>
    <rect x="130" y="52" width="90" height="12" rx="6" fill="#ec4899" opacity="0.6"/>
    <rect x="215" y="52" width="55" height="12" rx="6" fill="#f3f4f6" stroke="#e5e7eb" stroke-width="0.5"/>
    <rect x="80" y="82" width="140" height="12" rx="6" fill="#6366f1" opacity="0.6"/>
    <rect x="200" y="112" width="110" height="12" rx="6" fill="#10b981" opacity="0.6"/>
    <rect x="60" y="142" width="80" height="12" rx="6" fill="#fbbf24" opacity="0.6"/>
    <rect x="135" y="142" width="130" height="12" rx="6" fill="#f3f4f6" stroke="#e5e7eb" stroke-width="0.5"/>
  </g>
  <!-- Labels -->
  <g font-family="Arial" font-size="7" fill="#6b7280">
    <text x="45" y="61">Design</text>
    <text x="45" y="91">Develop</text>
    <text x="45" y="121">Test</text>
    <text x="45" y="151">Deploy</text>
  </g>
  <!-- People icons at timeline points -->
  <g transform="translate(170, 48)">
    <circle cx="0" cy="0" r="6" fill="white" stroke="#ec4899" stroke-width="1"/>
    <circle cx="0" cy="-1" r="2" fill="#ec4899" opacity="0.6"/>
    <circle cx="210" cy="78" r="6" fill="white" stroke="#6366f1" stroke-width="1"/>
    <circle cx="210" cy="77" r="2" fill="#6366f1" opacity="0.6"/>
    <circle cx="260" cy="108" r="6" fill="white" stroke="#10b981" stroke-width="1"/>
    <circle cx="260" cy="107" r="2" fill="#10b981" opacity="0.6"/>
  </g>
  <!-- Project manager at bottom -->
  <g transform="translate(55, 175)">
    <path d="M-10 8 Q-12 20 -7 35 L7 35 Q12 20 10 8 Z" fill="url(#p2g)" opacity="0.8"/>
    <ellipse cx="0" cy="-8" rx="11" ry="12" fill="url(#p2sk)"/>
    <path d="M-11 -8 Q-13 -20 0 -24 Q13 -20 11 -8 Q9 -14 0 -16 Q-9 -14 -11 -8Z" fill="#374151"/>
    <ellipse cx="-3" cy="-8" rx="1" ry="1.5" fill="#1f2937" opacity="0.6"/>
    <ellipse cx="3" cy="-8" rx="1" ry="1.5" fill="#1f2937" opacity="0.6"/>
  </g>
</svg>