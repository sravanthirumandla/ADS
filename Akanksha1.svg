<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bodyTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="30%" stop-color="#3B82F6"/>
      <stop offset="60%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="extrudeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E40AF"/>
      <stop offset="60%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="arrowCyan" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#0891B2"/>
    </linearGradient>
    <linearGradient id="arrowHead" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67E8F9"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="shineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="white" stop-opacity="0.45"/>
      <stop offset="35%" stop-color="white" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.3"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Extrusion layer 4 (deepest) -->
  <g transform="translate(16, 16)" opacity="0.25">
    <path d="M92 26 L20 180" stroke="#0F172A" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M92 26 L164 180" stroke="#0F172A" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- Extrusion layer 3 -->
  <g transform="translate(12, 12)">
    <path d="M92 26 L20 180" stroke="#1E3A8A" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M92 26 L164 180" stroke="#1E3A8A" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- Extrusion layer 2 -->
  <g transform="translate(8, 8)">
    <path d="M92 26 L20 180" stroke="url(#extrudeGrad)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M92 26 L164 180" stroke="url(#extrudeGrad)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- Extrusion layer 1 -->
  <g transform="translate(4, 4)">
    <path d="M92 26 L20 180" stroke="#2563EB" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.6"/>
    <path d="M92 26 L164 180" stroke="#2563EB" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.6"/>
  </g>

  <!-- === FRONT FACE: A letterform === -->
  <g filter="url(#shadow)">
    <path d="M92 26 L20 180" stroke="url(#bodyTop)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M92 26 L164 180" stroke="url(#bodyTop)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- === INTEGRATED ARROW CROSSBAR === -->
  <g filter="url(#shadow)">
    <path d="M46 130 L92 102 L138 130" stroke="url(#bodyTop)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- === RISING ARROW SHAFT === -->
  <g filter="url(#glow)">
    <path d="M92 102 L92 78" stroke="url(#arrowCyan)" stroke-width="5" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Arrowhead -->
  <path d="M92 78 L85 88 M92 78 L99 88" stroke="url(#arrowHead)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#glow)"/>
  <circle cx="92" cy="76" r="3" fill="#67E8F9" filter="url(#glow)"/>
  <circle cx="92" cy="76" r="1.5" fill="white" opacity="0.9"/>

  <!-- === REFLECTIONS === -->
  <path d="M85 32 L32 160" stroke="url(#shineGrad)" stroke-width="9" stroke-linecap="round" fill="none"/>
  <path d="M100 34 L156 160" stroke="url(#shineGrad)" stroke-width="6" stroke-linecap="round" fill="none"/>
  <path d="M80 30 L24 168" stroke="white" stroke-width="1.5" opacity="0.12" stroke-linecap="round" fill="none"/>
  <path d="M104 30 L158 168" stroke="white" stroke-width="1" opacity="0.06" stroke-linecap="round" fill="none"/>
  <path d="M52 127 L84 108" stroke="white" stroke-width="2.5" opacity="0.12" stroke-linecap="round" fill="none"/>
</svg>