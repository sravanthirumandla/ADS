<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="500" height="400">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eef2ff"/>
      <stop offset="100%" stop-color="#f5f3ff"/>
    </linearGradient>
    <linearGradient id="b1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#764ba2"/>
    </linearGradient>
    <linearGradient id="b2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="b3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="skin2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fecaca"/>
      <stop offset="100%" stop-color="#fca5a5"/>
    </linearGradient>
    <filter id="s2">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="500" height="400" fill="url(#bg2)"/>
  <circle cx="420" cy="60" r="160" fill="rgba(99,102,241,0.04)"/>
  <circle cx="60" cy="360" r="140" fill="rgba(251,191,36,0.04)"/>
  <circle cx="250" cy="200" r="120" fill="rgba(16,185,129,0.03)"/>

  <!-- Floor line -->
  <line x1="0" y1="350" x2="500" y2="350" stroke="#e5e7eb" stroke-width="1" opacity="0.5"/>

  <!-- Person 1 (left) - standing with tablet -->
  <g transform="translate(100, 160)" filter="url(#s2)">
    <path d="M-18 65 Q-20 95 -12 125 L12 125 Q20 95 18 65 Z" fill="url(#b1)" opacity="0.85"/>
    <rect x="-5" y="-4" width="10" height="12" rx="3" fill="url(#skin2)"/>
    <ellipse cx="0" cy="-18" rx="20" ry="22" fill="url(#skin2)"/>
    <path d="M-20 -18 Q-22 -40 0 -44 Q22 -40 20 -18 Q18 -28 0 -30 Q-18 -28 -20 -18Z" fill="#1f2937"/>
    <ellipse cx="-6" cy="-18" rx="2" ry="2.5" fill="#1f2937" opacity="0.7"/>
    <ellipse cx="6" cy="-18" rx="2" ry="2.5" fill="#1f2937" opacity="0.7"/>
    <path d="M-4 -11 Q0 -8 4 -11" fill="none" stroke="#1f2937" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
    <!-- Tablet in hand -->
    <path d="M-18 70 Q-30 80 -28 100" fill="none" stroke="url(#b1)" stroke-width="10" stroke-linecap="round" opacity="0.85"/>
    <rect x="-38" y="80" width="26" height="38" rx="3" fill="#1f2937"/>
    <rect x="-36" y="83" width="22" height="32" rx="2" fill="#312e81"/>
    <rect x="-34" y="87" width="18" height="10" rx="1" fill="rgba(99,102,241,0.4)"/>
    <rect x="-34" y="100" width="14" height="2" rx="1" fill="rgba(251,191,36,0.4)"/>
  </g>

  <!-- Person 2 (center) - holding laptop -->
  <g transform="translate(250, 150)" filter="url(#s2)">
    <path d="M-20 72 Q-22 105 -14 135 L14 135 Q22 105 20 72 Z" fill="url(#b2)" opacity="0.85"/>
    <rect x="-5" y="-4" width="10" height="12" rx="3" fill="url(#skin2)"/>
    <ellipse cx="0" cy="-20" rx="22" ry="24" fill="url(#skin2)"/>
    <path d="M-22 -20 Q-24 -44 0 -48 Q24 -44 22 -20 Q20 -32 0 -34 Q-20 -32 -22 -20Z" fill="#374151"/>
    <ellipse cx="-7" cy="-20" rx="2" ry="2.5" fill="#1f2937" opacity="0.7"/>
    <ellipse cx="7" cy="-20" rx="2" ry="2.5" fill="#1f2937" opacity="0.7"/>
    <path d="M-5 -13 Q0 -9 5 -13" fill="none" stroke="#1f2937" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
    <!-- Laptop -->
    <path d="M20 78 Q40 100 30 130" fill="none" stroke="url(#b2)" stroke-width="10" stroke-linecap="round" opacity="0.85"/>
    <path d="M20 78 Q10 95 15 120" fill="none" stroke="url(#b2)" stroke-width="8" stroke-linecap="round" opacity="0.85"/>
    <path d="M8 70 L48 70 L48 90 L8 90Z" fill="#1f2937"/>
    <path d="M10 72 L46 72 L46 88 L10 88Z" fill="url(#b1)"/>
    <rect x="12" y="75" width="10" height="2" rx="1" fill="rgba(255,255,255,0.2)"/>
    <rect x="12" y="79" width="8" height="2" rx="1" fill="rgba(255,255,255,0.2)"/>
    <rect x="5" y="90" width="46" height="4" rx="1" fill="#374151"/>
  </g>

  <!-- Person 3 (right) - pointing at presentation -->
  <g transform="translate(390, 170)" filter="url(#s2)">
    <path d="M-16 58 Q-18 88 -10 115 L10 115 Q18 88 16 58 Z" fill="url(#b3)" opacity="0.85"/>
    <rect x="-4" y="-3" width="8" height="10" rx="3" fill="url(#skin2)"/>
    <ellipse cx="0" cy="-16" rx="18" ry="20" fill="url(#skin2)"/>
    <path d="M-18 -16 Q-20 -38 0 -42 Q20 -38 18 -16 Q16 -26 0 -28 Q-16 -26 -18 -16Z" fill="#1f2937"/>
    <ellipse cx="-5" cy="-16" rx="2" ry="2.5" fill="#1f2937" opacity="0.7"/>
    <ellipse cx="5" cy="-16" rx="2" ry="2.5" fill="#1f2937" opacity="0.7"/>
    <path d="M-3 -10 Q0 -7 3 -10" fill="none" stroke="#1f2937" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
    <!-- Pointing arm -->
    <path d="M16 62 Q40 55 55 40" fill="none" stroke="url(#b3)" stroke-width="10" stroke-linecap="round" opacity="0.85"/>
    <circle cx="55" cy="40" r="6" fill="url(#skin2)"/>
  </g>

  <!-- Presentation chart / board -->
  <g transform="translate(300, 240)">
    <rect x="0" y="0" width="80" height="55" rx="4" fill="white" stroke="#d1d5db" stroke-width="1.5" filter="url(#s2)"/>
    <rect x="8" y="8" width="30" height="40" rx="3" fill="#f3f4f6"/>
    <rect x="12" y="35" width="8" height="10" rx="2" fill="url(#b1)" opacity="0.7"/>
    <rect x="22" y="25" width="8" height="20" rx="2" fill="url(#b2)" opacity="0.7"/>
    <rect x="44" y="8" width="28" height="40" rx="3" fill="#f3f4f6"/>
    <path d="M48 40 L52 30 L56 35 L60 20 L64 28 L68 14" fill="none" stroke="url(#b3)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/>
    <circle cx="52" cy="30" r="2.5" fill="url(#b3)"/>
    <circle cx="60" cy="20" r="2.5" fill="url(#b3)"/>
    <circle cx="68" cy="14" r="2.5" fill="url(#b3)"/>
  </g>

  <!-- Network connections between people -->
  <g opacity="0.2">
    <line x1="135" y1="240" x2="228" y2="240" stroke="#6366f1" stroke-width="2" stroke-dasharray="5,4"/>
    <line x1="270" y1="240" x2="370" y2="250" stroke="#fbbf24" stroke-width="2" stroke-dasharray="5,4"/>
    <line x1="135" y1="240" x2="370" y2="250" stroke="#10b981" stroke-width="1.5" stroke-dasharray="5,4"/>
  </g>

  <!-- Network node dots -->
  <g opacity="0.3">
    <circle cx="180" cy="238" r="3" fill="#6366f1"/>
    <circle cx="320" cy="245" r="3" fill="#fbbf24"/>
  </g>

  <!-- Floating data icons -->
  <g transform="translate(430, 100)">
    <rect x="0" y="0" width="30" height="20" rx="3" fill="white" stroke="#d1d5db" stroke-width="1" opacity="0.8"/>
    <rect x="4" y="4" width="8" height="4" rx="1" fill="#6366f1" opacity="0.4"/>
    <rect x="4" y="10" width="12" height="3" rx="1" fill="#10b981" opacity="0.3"/>
    <rect x="18" y="6" width="8" height="8" rx="2" fill="#fbbf24" opacity="0.3"/>
  </g>

  <g transform="translate(50, 80)">
    <circle cx="0" cy="0" r="12" fill="white" stroke="#d1d5db" stroke-width="1" opacity="0.8"/>
    <path d="M-5 3 L0 -5 L5 3Z" fill="#6366f1" opacity="0.4"/>
    <path d="M-8 6 L0 -2 L8 6Z" fill="none" stroke="#fbbf24" stroke-width="1.5" opacity="0.3"/>
  </g>

  <!-- Label -->
  <rect x="175" y="330" width="150" height="36" rx="18" fill="url(#b1)" opacity="0.1"/>
  <text x="250" y="353" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="url(#b1)" text-anchor="middle" letter-spacing="1">TEAM COLLABORATION</text>
</svg>