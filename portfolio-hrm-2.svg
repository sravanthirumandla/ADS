<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="400" height="250">
  <defs>
    <linearGradient id="h2bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f3ff"/>
      <stop offset="100%" stop-color="#ede9fe"/>
    </linearGradient>
    <linearGradient id="h2g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="h2sk" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fecaca"/>
      <stop offset="100%" stop-color="#fca5a5"/>
    </linearGradient>
  </defs>
  <rect width="400" height="250" fill="url(#h2bg)" rx="12"/>
  <!-- Desk -->
  <rect x="30" y="195" width="340" height="8" rx="2" fill="white" stroke="#e5e7eb" stroke-width="1"/>
  <!-- HR manager -->
  <g transform="translate(80, 110)">
    <path d="M-14 8 Q-16 35 -10 58 L10 58 Q16 35 14 8 Z" fill="url(#h2g)" opacity="0.8"/>
    <rect x="-3" y="-1" width="6" height="10" rx="2" fill="url(#h2sk)"/>
    <ellipse cx="0" cy="-14" rx="16" ry="18" fill="url(#h2sk)"/>
    <path d="M-16 -14 Q-18 -32 0 -36 Q18 -32 16 -14 Q14 -22 0 -24 Q-14 -22 -16 -14Z" fill="#374151"/>
    <ellipse cx="-5" cy="-14" rx="1.5" ry="2" fill="#1f2937" opacity="0.6"/>
    <ellipse cx="5" cy="-14" rx="1.5" ry="2" fill="#1f2937" opacity="0.6"/>
    <path d="M-5 -7 Q0 -4 5 -7" fill="none" stroke="#1f2937" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
    <path d="M14 25 Q28 55 20 78" fill="none" stroke="url(#h2g)" stroke-width="8" stroke-linecap="round" opacity="0.8"/>
    <circle cx="20" cy="78" r="5" fill="url(#h2sk)"/>
  </g>
  <!-- Monitor with HR dashboard -->
  <g transform="translate(190, 120)">
    <rect x="30" y="45" width="6" height="10" rx="1" fill="#9ca3af"/>
    <rect x="22" y="50" width="22" height="4" rx="2" fill="#9ca3af"/>
    <rect x="0" y="0" width="90" height="50" rx="5" fill="#1f2937"/>
    <rect x="3" y="3" width="84" height="44" rx="3" fill="#312e81"/>
    <!-- HR metrics -->
    <rect x="8" y="8" width="30" height="16" rx="2" fill="rgba(139,92,246,0.3)"/>
    <text x="16" y="14" font-family="Arial" font-size="5" fill="rgba(255,255,255,0.6)">Total</text>
    <text x="23" y="21" font-family="Arial" font-size="8" fill="white" font-weight="600">128</text>
    <rect x="42" y="8" width="30" height="16" rx="2" fill="rgba(16,185,129,0.3)"/>
    <text x="50" y="14" font-family="Arial" font-size="5" fill="rgba(255,255,255,0.6)">New</text>
    <text x="57" y="21" font-family="Arial" font-size="8" fill="white" font-weight="600">12</text>
    <rect x="8" y="28" width="40" height="3" rx="1.5" fill="rgba(255,255,255,0.1)"/>
    <rect x="8" y="34" width="32" height="3" rx="1.5" fill="rgba(255,255,255,0.08)"/>
    <rect x="8" y="40" width="45" height="3" rx="1.5" fill="rgba(255,255,255,0.06)"/>
    <!-- Pie chart -->
    <circle cx="72" cy="34" r="10" fill="none" stroke="#8b5cf6" stroke-width="3" stroke-dasharray="16 16" opacity="0.5"/>
    <circle cx="72" cy="34" r="10" fill="none" stroke="#10b981" stroke-width="3" stroke-dasharray="10 22" opacity="0.4"/>
  </g>
  <!-- Documents on desk -->
  <g transform="translate(310, 175)">
    <rect x="0" y="0" width="24" height="30" rx="2" fill="white" stroke="#e5e7eb" stroke-width="1"/>
    <rect x="0" y="0" width="24" height="8" rx="2" fill="#8b5cf6" opacity="0.15"/>
    <rect x="3" y="11" width="18" height="2" rx="1" fill="#d1d5db"/>
    <rect x="3" y="16" width="14" height="2" rx="1" fill="#d1d5db"/>
    <rect x="3" y="21" width="18" height="2" rx="1" fill="#d1d5db"/>
  </g>
  <!-- Employee avatar icon -->
  <g transform="translate(50, 170)">
    <circle cx="10" cy="6" r="5" fill="#8b5cf6" opacity="0.2"/>
    <circle cx="10" cy="4" r="2.5" fill="#8b5cf6" opacity="0.4"/>
    <rect x="0" y="16" width="10" height="4" rx="2" transform="rotate(-20 5 18)" fill="#8b5cf6" opacity="0.15"/>
    <rect x="10" y="16" width="10" height="4" rx="2" transform="rotate(20 15 18)" fill="#8b5cf6" opacity="0.15"/>
  </g>
</svg>